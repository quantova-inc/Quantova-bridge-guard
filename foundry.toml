[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = true
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[fuzz]
runs = 512

[lint]
exclude_lints = ["incorrect-shift", "unsafe-typecast", "block-timestamp"]

[profile.local]
ffi = true
